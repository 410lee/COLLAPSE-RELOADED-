<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>COLLAPSE: RELOADED</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    background: #080a10;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
    min-height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
}

.game {
    width: 100%;
    max-width: 500px;
    min-height: 100vh;
    padding: 18px 14px;
    display: flex;
    flex-direction: column;
}

.header {
    text-align: center;
    margin-bottom: 12px;
}

.title {
    font-size: 27px;
    font-weight: 900;
    letter-spacing: 3px;
    margin: 0;
}

.subtitle {
    color: #7f8798;
    font-size: 11px;
    letter-spacing: 4px;
    margin-top: 3px;
}

.stats {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 12px;
}

.stat {
    flex: 1;
    background: #131722;
    border: 1px solid #252b38;
    border-radius: 14px;
    padding: 9px;
    text-align: center;
}

.stat-label {
    color: #7f8798;
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
}

.stat-value {
    font-size: 21px;
    font-weight: 800;
    margin-top: 2px;
}

#board {
    width: 100%;
    aspect-ratio: 8 / 12;
    background: #0d1018;
    border: 2px solid #272d3b;
    border-radius: 18px;
    padding: 5px;
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    grid-template-rows: repeat(12, 1fr);
    gap: 3px;
    box-shadow:
        0 0 35px rgba(0,0,0,.5),
        inset 0 0 25px rgba(0,0,0,.45);
    touch-action: manipulation;
}

.cell {
    border-radius: 7px;
    position: relative;
    transition: transform .12s ease, opacity .12s ease;
}

.cell:active {
    transform: scale(.82);
}

.empty {
    background: transparent;
}

.red {
    background: linear-gradient(145deg, #ff4d67, #c91f40);
    box-shadow: 0 0 10px rgba(255,55,85,.28);
}

.blue {
    background: linear-gradient(145deg, #4d9dff, #2461d8);
    box-shadow: 0 0 10px rgba(60,130,255,.28);
}

.green {
    background: linear-gradient(145deg, #4ee38a, #18a85b);
    box-shadow: 0 0 10px rgba(40,220,120,.28);
}

.yellow {
    background: linear-gradient(145deg, #ffe96a, #e4a91f);
    box-shadow: 0 0 10px rgba(255,215,55,.28);
}

.purple {
    background: linear-gradient(145deg, #c277ff, #7436ce);
    box-shadow: 0 0 10px rgba(170,80,255,.28);
}

.controls {
    display: flex;
    gap: 10px;
    margin-top: 12px;
}

button {
    border: 0;
    border-radius: 15px;
    padding: 14px;
    font-size: 14px;
    font-weight: 800;
    letter-spacing: 1px;
    cursor: pointer;
    touch-action: manipulation;
}

#restart {
    flex: 1;
    background: #202634;
    color: white;
}

#addRow {
    flex: 1;
    background: white;
    color: #080a10;
}

.message {
    text-align: center;
    min-height: 24px;
    margin-top: 9px;
    font-weight: 800;
    color: #9da6b8;
    font-size: 14px;
}

.combo {
    color: #ffffff;
    animation: pop .25s ease;
}

@keyframes pop {
    0% { transform: scale(.7); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
}

.game-over {
    position: fixed;
    inset: 0;
    background: rgba(5,7,12,.88);
    backdrop-filter: blur(8px);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 25px;
    z-index: 10;
}

.game-over-card {
    width: 100%;
    max-width: 360px;
    background: #141822;
    border: 1px solid #303747;
    border-radius: 24px;
    padding: 30px 22px;
    text-align: center;
}

.game-over-card h2 {
    font-size: 32px;
    margin: 0 0 8px;
    letter-spacing: 2px;
}

.final-score {
    font-size: 45px;
    font-weight: 900;
    margin: 10px 0 20px;
}

#playAgain {
    width: 100%;
    background: white;
    color: black;
}

@media (max-height: 700px) {
    .game {
        padding-top: 10px;
    }

    .title {
        font-size: 23px;
    }
}
</style>
</head>

<body>

<div class="game">

    <div class="header">
        <div class="title">COLLAPSE: RELOADED</div>
        <div class="subtitle">TAP • COLLAPSE • DOMINATE</div>
    </div>

    <div class="stats">
        <div class="stat">
            <div class="stat-label">Score</div>
            <div class="stat-value" id="score">0</div>
        </div>

        <div class="stat">
            <div class="stat-label">Combo</div>
            <div class="stat-value" id="combo">0</div>
        </div>

        <div class="stat">
            <div class="stat-label">Best</div>
            <div class="stat-value" id="best">0</div>
        </div>
    </div>

    <div id="board"></div>

    <div class="message" id="message">
        Tap groups of 2 or more matching blocks!
    </div>

    <div class="controls">
        <button id="restart">↻ RESTART</button>
        <button id="addRow">＋ ADD ROW</button>
    </div>

</div>

<div class="game-over" id="gameOver">
    <div class="game-over-card">
        <h2>GAME OVER</h2>
        <div>Your Score</div>
        <div class="final-score" id="finalScore">0</div>
        <button id="playAgain">PLAY AGAIN</button>
    </div>
</div>

<script>

const COLS = 8;
const ROWS = 12;

const COLORS = [
    "red",
    "blue",
    "green",
    "yellow",
    "purple"
];

let board = [];
let score = 0;
let combo = 0;
let best = Number(localStorage.getItem("collapseBest") || 0);

const boardElement = document.getElementById("board");
const scoreElement = document.getElementById("score");
const comboElement = document.getElementById("combo");
const bestElement = document.getElementById("best");
const messageElement = document.getElementById("message");
const gameOverElement = document.getElementById("gameOver");
const finalScoreElement = document.getElementById("finalScore");

bestElement.textContent = best;

function randomColor() {
    return COLORS[Math.floor(Math.random() * COLORS.length)];
}

function createBoard() {
    board = [];

    for (let row = 0; row < ROWS; row++) {
        board[row] = [];

        for (let col = 0; col < COLS; col++) {
            board[row][col] = randomColor();
        }
    }

    score = 0;
    combo = 0;

    updateStats();
    render();
}

function render() {
    boardElement.innerHTML = "";

    for (let row = 0; row < ROWS; row++) {
        for (let col = 0; col < COLS; col++) {

            const cell = document.createElement("div");
            cell.className = "cell";

            const color = board[row][col];

            if (color) {
                cell.classList.add(color);
            } else {
                cell.classList.add("empty");
            }

            cell.addEventListener("click", () => {
                collapse(row, col);
            });

            boardElement.appendChild(cell);
        }
    }
}

function getGroup(startRow, startCol) {

    const color = board[startRow][startCol];

    if (!color) return [];

    const group = [];
    const visited = new Set();

    const queue = [[startRow, startCol]];

    while (queue.length) {

        const [row, col] = queue.shift();
        const key = `${row},${col}`;

        if (visited.has(key)) continue;

        visited.add(key);

        if (
            row < 0 ||
            row >= ROWS ||
            col < 0 ||
            col >= COLS
        ) continue;

        if (board[row][col] !== color) continue;

        group.push([row, col]);

        queue.push([row - 1, col]);
        queue.push([row + 1, col]);
        queue.push([row, col - 1]);
        queue.push([row, col + 1]);
    }

    return group;
}

function collapse(row, col) {

    const group = getGroup(row, col);

    if (group.length < 2) {

        combo = 0;
        updateStats();

        messageElement.textContent =
            "Need at least 2 matching blocks!";

        return;
    }

    combo++;

    const size = group.length;

    const points = size * size * 10 * combo;

    score += points;

    for (const [r, c] of group) {
        board[r][c] = null;
    }

    applyGravity();

    updateBest();

    render();

    messageElement.innerHTML =
        `<span class="combo">💥 ${size} BLOCKS! +${points} POINTS</span>`;

    updateStats();

    setTimeout(() => {

        if (combo > 0) {
            combo = 0;
            updateStats();
        }

    }, 900);
}

function applyGravity() {

    for (let col = 0; col < COLS; col++) {

        const remaining = [];

        for (let row = ROWS - 1; row >= 0; row--) {

            if (board[row][col]) {
                remaining.push(board[row][col]);
            }
        }

        for (let row = ROWS - 1; row >= 0; row--) {

            const index = ROWS - 1 - row;

            board[row][col] =
                remaining[index] || null;
        }
    }
}

function addNewRow() {

    // Check if the top row is occupied.
    for (let col = 0; col < COLS; col++) {

        if (board[0][col]) {
            endGame();
            return;
        }
    }

    // Move everything upward.
    for (let row = 0; row < ROWS - 1; row++) {

        for (let col = 0; col < COLS; col++) {

            board[row][col] =
                board[row + 1][col];
        }
    }

    // Create a new row at the bottom.
    for (let col = 0; col < COLS; col++) {
        board[ROWS - 1][col] = randomColor();
    }

    combo = 0;

    render();
    updateStats();

    messageElement.textContent =
        "⬆️ New row incoming!";
}

function endGame() {

    finalScoreElement.textContent = score;

    gameOverElement.style.display = "flex";
}

function updateStats() {

    scoreElement.textContent = score;
    comboElement.textContent = combo;
    bestElement.textContent = best;
}

function updateBest() {

    if (score > best) {

        best = score;

        localStorage.setItem(
            "collapseBest",
            best
        );
    }
}

function restart() {

    gameOverElement.style.display = "none";

    createBoard();

    messageElement.textContent =
        "Tap groups of 2 or more matching blocks!";
}

document
    .getElementById("restart")
    .addEventListener("click", restart);

document
    .getElementById("addRow")
    .addEventListener("click", addNewRow);

document
    .getElementById("playAgain")
    .addEventListener("click", restart);

createBoard();

</script>

</body>
</html>
