<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>COLLAPSE: RELOADED</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
  background:#070910;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  touch-action:manipulation;
}

body{
  display:flex;
  justify-content:center;
  overflow-x:hidden;
}

.app{
  width:min(100%,560px);
  min-height:100vh;
  padding:
    max(18px,env(safe-area-inset-top))
    14px
    max(28px,env(safe-area-inset-bottom));
}

.header{
  text-align:center;
  margin-bottom:12px;
}

.logo{
  font-size:27px;
  font-weight:900;
  letter-spacing:4px;
  margin-bottom:2px;
}

.subtitle{
  font-size:9px;
  font-weight:800;
  letter-spacing:4px;
  color:#7f8597;
}

.sound{
  display:block;
  margin:10px 0 8px auto;
  width:max-content;
  padding:7px 10px;
  border-radius:10px;
  border:1px solid #252b3b;
  background:#0d111c;
  color:#9da5b8;
  font-size:10px;
  font-weight:800;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-bottom:12px;
}

.stat{
  background:#101521;
  border:1px solid #242b3b;
  border-radius:13px;
  padding:7px 4px 8px;
  text-align:center;
}

.stat-label{
  font-size:8px;
  letter-spacing:2px;
  color:#747c8f;
  font-weight:800;
}

.stat-value{
  font-size:20px;
  line-height:22px;
  font-weight:900;
}

#comboValue{
  color:#ffd62e;
}

.board-wrap{
  position:relative;
  border:2px solid #252c3d;
  border-radius:17px;
  background:#090c14;
  padding:5px;
  box-shadow:
    0 0 0 3px rgba(255,255,255,.015),
    0 10px 30px rgba(0,0,0,.4);
  overflow:hidden;
}

.board-wrap.danger{
  border-color:#ff315b;
  box-shadow:
    0 0 18px rgba(255,30,80,.45),
    0 0 45px rgba(255,30,80,.18);
}

.board{
  display:grid;
  grid-template-columns:repeat(8,1fr);
  gap:3px;
  aspect-ratio:8/12;
}

.cell{
  position:relative;
  min-width:0;
  min-height:0;
  border-radius:7px;
  background:#0d111a;
  overflow:hidden;
}

.block{
  position:absolute;
  inset:0;
  border-radius:7px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:clamp(15px,4.5vw,24px);
  font-weight:900;
  user-select:none;
  transition:
    transform .09s ease,
    opacity .09s ease,
    filter .09s ease;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.25),
    inset 0 -3px 5px rgba(0,0,0,.18);
}

.block:active{
  transform:scale(.88);
}

.red{
  background:linear-gradient(145deg,#ff4768,#d91f43);
}

.yellow{
  background:linear-gradient(145deg,#ffe56a,#e8b928);
  color:#fff;
}

.blue{
  background:linear-gradient(145deg,#4b91ff,#2464c7);
}

.green{
  background:linear-gradient(145deg,#4ed987,#20ad61);
}

.purple{
  background:linear-gradient(145deg,#b265f4,#8038c8);
}

.special{
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.5),
    0 0 9px rgba(255,255,255,.3);
}

.bomb{
  background:
    radial-gradient(circle at 35% 30%,#ffcf42,#ff7617 45%,#d92d23);
}

.row-clear{
  background:
    linear-gradient(135deg,#ffe566,#ff8c19);
}

.rainbow{
  background:
    conic-gradient(
      #ff355d,
      #ffd62e,
      #44dc7c,
      #3e8dff,
      #a74ff0,
      #ff355d
    );
  box-shadow:
    0 0 11px rgba(255,255,255,.65),
    inset 0 0 8px rgba(255,255,255,.3);
}

.flash{
  animation:flash .25s ease;
}

@keyframes flash{
  0%{transform:scale(1)}
  45%{transform:scale(1.2);filter:brightness(1.8)}
  100%{transform:scale(0);opacity:0}
}

.drop{
  animation:drop .18s ease;
}

@keyframes drop{
  from{
    transform:translateY(-35px);
    opacity:.4;
  }
  to{
    transform:translateY(0);
    opacity:1;
  }
}

.rise{
  animation:rise .22s ease;
}

@keyframes rise{
  from{
    transform:translateY(18px);
    opacity:.3;
  }
  to{
    transform:translateY(0);
    opacity:1;
  }
}

.message{
  min-height:28px;
  text-align:center;
  padding:7px 4px 3px;
  font-size:13px;
  font-weight:900;
  letter-spacing:.4px;
}

.message.combo{
  color:#ffd62e;
}

.message.chain{
  color:#ff65df;
}

.message.danger{
  color:#ff4265;
}

.controls{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

button{
  border:0;
  border-radius:13px;
  min-height:49px;
  font-size:13px;
  font-weight:900;
  letter-spacing:1px;
}

.restart{
  background:#1c2331;
  color:#fff;
}

.pause{
  background:#fff;
  color:#11151e;
}

.pause.paused{
  background:#ffd52e;
}

.legend{
  display:flex;
  justify-content:center;
  gap:14px;
  margin-top:8px;
  color:#737b8e;
  font-size:9px;
  font-weight:800;
}

.overlay{
  position:absolute;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(4,6,11,.78);
  backdrop-filter:blur(5px);
  z-index:20;
}

.overlay.show{
  display:flex;
}

.overlay-card{
  width:82%;
  padding:25px 18px;
  border-radius:20px;
  border:1px solid #30384b;
  background:#101521;
  text-align:center;
  box-shadow:0 20px 50px rgba(0,0,0,.6);
}

.overlay-title{
  font-size:27px;
  font-weight:900;
  margin-bottom:8px;
}

.overlay-text{
  color:#a7adbd;
  font-size:13px;
  line-height:1.5;
}

.overlay button{
  width:100%;
  margin-top:15px;
  background:#fff;
  color:#111;
}

@media(max-width:380px){
  .logo{
    font-size:23px;
  }

  .stat-value{
    font-size:18px;
  }
}
</style>
</head>

<body>

<div class="app">

  <div class="header">
    <div class="logo">COLLAPSE: RELOADED</div>
    <div class="subtitle">TAP • COLLAPSE • DOMINATE</div>
  </div>

  <button class="sound" id="soundBtn">🔊 SOUND ON</button>

  <div class="stats">

    <div class="stat">
      <div class="stat-label">SCORE</div>
      <div class="stat-value" id="score">0</div>
    </div>

    <div class="stat">
      <div class="stat-label">COMBO</div>
      <div class="stat-value" id="comboValue">0</div>
    </div>

    <div class="stat">
      <div class="stat-label">BEST</div>
      <div class="stat-value" id="best">0</div>
    </div>

  </div>

  <div class="board-wrap" id="boardWrap">

    <div class="board" id="board"></div>

    <div class="overlay" id="overlay">
      <div class="overlay-card">
        <div class="overlay-title" id="overlayTitle">
          PAUSED
        </div>

        <div class="overlay-text" id="overlayText">
          Take a breath. The blocks are waiting.
        </div>

        <button id="overlayButton">
          RESUME
        </button>
      </div>
    </div>

  </div>

  <div class="message" id="message">
    Tap groups of 2 or more matching blocks!
  </div>

  <div class="controls">
    <button class="restart" id="restart">
      ↻ RESTART
    </button>

    <button class="pause" id="pause">
      II PAUSE
    </button>
  </div>

  <div class="legend">
    <span>💣 BOMB</span>
    <span>⚡ ROW</span>
    <span>🌈 COLOR</span>
  </div>

</div>

<script>

/* =========================================================
   COLLAPSE: RELOADED
   COMBO + CHAIN REACTION EDITION
   ========================================================= */

const ROWS = 12;
const COLS = 8;

const COLORS = [
  "red",
  "yellow",
  "blue",
  "green",
  "purple"
];

const boardEl = document.getElementById("board");
const boardWrap = document.getElementById("boardWrap");

const scoreEl = document.getElementById("score");
const comboEl = document.getElementById("comboValue");
const bestEl = document.getElementById("best");

const messageEl = document.getElementById("message");

const restartBtn = document.getElementById("restart");
const pauseBtn = document.getElementById("pause");

const soundBtn = document.getElementById("soundBtn");

const overlay = document.getElementById("overlay");
const overlayTitle = document.getElementById("overlayTitle");
const overlayText = document.getElementById("overlayText");
const overlayButton = document.getElementById("overlayButton");


/* =========================================================
   STATE
   ========================================================= */

let grid = [];

let score = 0;
let best = Number(localStorage.getItem("collapseReloadedBest") || 0);

let combo = 0;
let chain = 0;

let paused = false;
let gameOver = false;

let soundOn = true;

let riseTimer = null;
let dangerTimer = null;

let audioCtx = null;

bestEl.textContent = best.toLocaleString();


/* =========================================================
   AUDIO
   ========================================================= */

function initAudio(){

  if(!audioCtx){

    try{
      audioCtx = new (
        window.AudioContext ||
        window.webkitAudioContext
      )();
    }catch(e){}
  }

  if(audioCtx && audioCtx.state === "suspended"){
    audioCtx.resume();
  }
}

function beep(freq,duration=.08,type="sine",volume=.035){

  if(!soundOn || !audioCtx) return;

  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  osc.type = type;
  osc.frequency.value = freq;

  gain.gain.setValueAtTime(volume,audioCtx.currentTime);

  gain.gain.exponentialRampToValueAtTime(
    .001,
    audioCtx.currentTime + duration
  );

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start();

  osc.stop(
    audioCtx.currentTime + duration
  );
}

function playClearSound(size){

  initAudio();

  beep(
    420 + Math.min(size,10)*35,
    .08,
    "triangle",
    .04
  );

  setTimeout(()=>{
    beep(
      620 + Math.min(size,10)*30,
      .09,
      "triangle",
      .035
    );
  },45);
}

function playChainSound(level){

  initAudio();

  const base = 500 + level*70;

  beep(base,.09,"square",.045);

  setTimeout(()=>{
    beep(base*1.25,.1,"square",.04);
  },65);

  if(level >= 3){

    setTimeout(()=>{
      beep(base*1.55,.13,"sawtooth",.035);
    },125);
  }
}

function playDangerSound(){

  initAudio();

  beep(180,.15,"sawtooth",.045);

  setTimeout(()=>{
    beep(120,.16,"sawtooth",.035);
  },180);
}


/* =========================================================
   HAPTICS
   ========================================================= */

function vibrate(pattern){

  if(navigator.vibrate){

    try{
      navigator.vibrate(pattern);
    }catch(e){}
  }
}

function hapticClear(size){

  vibrate(
    Math.min(
      80,
      12 + size*7
    )
  );
}

function hapticChain(level){

  if(level === 1){
    vibrate([20]);
  }

  else if(level === 2){
    vibrate([25,30,25]);
  }

  else if(level === 3){
    vibrate([30,30,50]);
  }

  else{
    vibrate([40,30,70,30,90]);
  }
}


/* =========================================================
   BOARD HELPERS
   ========================================================= */

function randomColor(){

  return COLORS[
    Math.floor(
      Math.random()*COLORS.length
    )
  ];
}

function emptyCell(){

  return {
    color:null,
    special:null
  };
}

function randomBlock(){

  let special = null;

  /*
     Keep specials uncommon so normal
     collapse gameplay stays important.
  */

  const roll = Math.random();

  if(roll < .025){
    special = "bomb";
  }

  else if(roll < .05){
    special = "row";
  }

  else if(roll < .065){
    special = "rainbow";
  }

  return {
    color:randomColor(),
    special
  };
}

function createBoard(){

  grid = [];

  for(let r=0;r<ROWS;r++){

    const row=[];

    for(let c=0;c<COLS;c++){

      row.push(
        randomBlock()
      );
    }

    grid.push(row);
  }
}

function render(){

  boardEl.innerHTML="";

  for(let r=0;r<ROWS;r++){

    for(let c=0;c<COLS;c++){

      const cell = document.createElement("div");

      cell.className="cell";

      const block = grid[r][c];

      if(block){

        const el = document.createElement("div");

        el.className =
          "block " +
          block.color;

        if(block.special){

          el.classList.add(
            "special",
            block.special === "bomb"
              ? "bomb"
              : block.special === "row"
                ? "row-clear"
                : "rainbow"
          );

          if(block.special === "bomb"){
            el.textContent="💣";
          }

          else if(block.special === "row"){
            el.textContent="⚡";
          }

          else{
            el.textContent="🌈";
          }
        }

        cell.appendChild(el);
      }

      cell.dataset.row=r;
      cell.dataset.col=c;

      cell.addEventListener(
        "pointerdown",
        handleTap,
        {passive:true}
      );

      boardEl.appendChild(cell);
    }
  }
}


/* =========================================================
   POSITION HELPERS
   ========================================================= */

function inside(r,c){

  return (
    r>=0 &&
    r<ROWS &&
    c>=0 &&
    c<COLS
  );
}

function neighbors(r,c){

  return [
    [r-1,c],
    [r+1,c],
    [r,c-1],
    [r,c+1]
  ];
}


/* =========================================================
   FIND MATCHING GROUP
   ========================================================= */

function findGroup(startR,startC){

  const start = grid[startR][startC];

  if(!start) return [];

  /*
     Rainbow blocks act as wildcards.
  */

  const targetColor = start.color;

  const result=[];

  const queue=[
    [startR,startC]
  ];

  const visited = new Set();

  visited.add(
    startR+","+startC
  );

  while(queue.length){

    const [r,c] = queue.shift();

    const block=grid[r][c];

    if(!block) continue;

    const matches =
      block.color === targetColor ||
      block.special === "rainbow" ||
      start.special === "rainbow";

    if(!matches) continue;

    result.push([r,c]);

    for(const [nr,nc] of neighbors(r,c)){

      if(!inside(nr,nc)) continue;

      const key=nr+","+nc;

      if(visited.has(key)) continue;

      const next=grid[nr][nc];

      if(!next) continue;

      if(
        next.color===targetColor ||
        next.special==="rainbow"
      ){

        visited.add(key);

        queue.push([
          nr,
          nc
        ]);
      }
    }
  }

  return result;
}


/* =========================================================
   SPECIAL EFFECT TARGETS
   ========================================================= */

function getSpecialTargets(r,c,special){

  const targets=[];

  if(special==="bomb"){

    for(let rr=r-1;rr<=r+1;rr++){

      for(let cc=c-1;cc<=c+1;cc++){

        if(
          inside(rr,cc) &&
          !(rr===r && cc===c)
        ){

          targets.push([
            rr,
            cc
          ]);
        }
      }
    }
  }

  else if(special==="row"){

    for(let cc=0;cc<COLS;cc++){

      if(grid[r][cc]){

        targets.push([
          r,
          cc
        ]);
      }
    }
  }

  else if(special==="rainbow"){

    const color=grid[r][c]?.color;

    if(color){

      for(let rr=0;rr<ROWS;rr++){

        for(let cc=0;cc<COLS;cc++){

          if(
            grid[rr][cc] &&
            grid[rr][cc].color===color
          ){

            targets.push([
              rr,
              cc
            ]);
          }
        }
      }
    }
  }

  return targets;
}


/* =========================================================
   CLEAR ANIMATION
   ========================================================= */

function animateCells(cells){

  const cellEls = boardEl.children;

  for(const [r,c] of cells){

    const index =
      r*COLS+c;

    const cell =
      cellEls[index];

    if(!cell) continue;

    const block =
      cell.querySelector(".block");

    if(block){

      block.classList.add(
        "flash"
      );
    }
  }
}


/* =========================================================
   CLEAR BLOCKS
   ========================================================= */

function clearBlocks(cells){

  const unique = new Map();

  for(const [r,c] of cells){

    if(!inside(r,c)) continue;

    if(!grid[r][c]) continue;

    unique.set(
      r+","+c,
      [r,c]
    );
  }

  const finalCells=[
    ...unique.values()
  ];

  if(!finalCells.length) return 0;

  animateCells(finalCells);

  /*
     Score increases harder as the
     chain gets deeper.
  */

  const basePoints =
    finalCells.length *
    40;

  const comboMultiplier =
    Math.max(1,combo);

  const chainMultiplier =
    Math.max(1,chain);

  const points =
    basePoints *
    comboMultiplier *
    chainMultiplier;

  score += points;

  if(score>best){

    best=score;

    localStorage.setItem(
      "collapseReloadedBest",
      best
    );
  }

  updateStats();

  for(const [r,c] of finalCells){

    grid[r][c]=null;
  }

  playClearSound(
    finalCells.length
  );

  if(chain>1){

    playChainSound(chain);

    hapticChain(chain);
  }

  else{

    hapticClear(
      finalCells.length
    );
  }

  return finalCells.length;
}


/* =========================================================
   GRAVITY
   ========================================================= */

function collapseColumns(){

  for(let c=0;c<COLS;c++){

    const blocks=[];

    for(let r=ROWS-1;r>=0;r--){

      if(grid[r][c]){

        blocks.push(
          grid[r][c]
        );
      }
    }

    for(let r=ROWS-1;r>=0;r--){

      const index =
        ROWS-1-r;

      grid[r][c] =
        blocks[index] || null;
    }
  }
}


/* =========================================================
   FIND ALL AUTOMATIC CHAINS
   ========================================================= */

async function resolveChains(){

  let safety=0;

  while(safety<20){

    safety++;

    let found=[];

    /*
       Search every occupied cell for
       a new group of 2+.
    */

    for(let r=0;r<ROWS;r++){

      for(let c=0;c<COLS;c++){

        if(!grid[r][c]) continue;

        const group =
          findGroup(r,c);

        if(group.length>=2){

          for(const cell of group){

            found.push(cell);
          }
        }
      }
    }

    /*
       Remove duplicates.
    */

    const unique=new Map();

    for(const [r,c] of found){

      unique.set(
        r+","+c,
        [r,c]
      );
    }

    found=[
      ...unique.values()
    ];

    if(!found.length){

      break;
    }

    chain++;

    const cleared =
      clearBlocks(found);

    messageEl.className=
      chain>1
        ? "message chain"
        : "message combo";

    if(chain>1){

      messageEl.textContent =
        "⛓️ CHAIN x"+
        chain+
        "! +"+
        (
          cleared *
          40 *
          Math.max(1,combo) *
          chain
        )+
        " BONUS";
    }

    else{

      messageEl.textContent =
        "💥 "+
        cleared+
        " BLOCKS!";
    }

    render();

    /*
       Give the falling blocks time
       to visually settle before checking
       for another chain.
    */

    await wait(150);

    collapseColumns();

    render();

    await wait(110);
  }

  /*
     Reset chain after the entire move.
  */

  if(chain>0){

    setTimeout(()=>{

      if(!paused && !gameOver){

        messageEl.className="message";

        messageEl.textContent =
          chain>1
            ? "🔥 CHAIN COMPLETE!"
            : "Tap groups of 2 or more matching blocks!";
      }

    },650);
  }

  return chain;
}


/* =========================================================
   TAP HANDLER
   ========================================================= */

async function handleTap(e){

  if(paused || gameOver) return;

  initAudio();

  const cell=e.currentTarget;

  const r=
    Number(cell.dataset.row);

  const c=
    Number(cell.dataset.col);

  const block=grid[r][c];

  if(!block) return;

  /*
     Find connected matching blocks.
  */

  let group =
    findGroup(r,c);

  /*
     Special blocks can be activated
     even when their normal group is small.
  */

  if(
    block.special &&
    group.length<2
  ){

    group=[
      [r,c]
    ];
  }

  if(
    group.length<2 &&
    !block.special
  ){

    combo=0;

    messageEl.className="message";

    messageEl.textContent =
      "Need 2 or more matching blocks!";

    vibrate(8);

    return;
  }

  /*
     Successful move.
     Increase combo before scoring.
  */

  combo++;

  /*
     Collect special targets.
  */

  const targets=[
    ...group
  ];

  for(const [gr,gc] of group){

    const special=
      grid[gr][gc]?.special;

    if(special){

      targets.push(
        ...getSpecialTargets(
          gr,
          gc,
          special
        )
      );
    }
  }

  const cleared =
    clearBlocks(targets);

  if(cleared<=0) return;

  messageEl.className=
    combo>=3
      ? "message chain"
      : "message combo";

  if(combo===1){

    messageEl.textContent =
      "💥 "+
      cleared+
      " BLOCKS! +"+
      (
        cleared*40
      )+
      " POINTS";
  }

  else if(combo===2){

    messageEl.textContent =
      "🔥 2x COMBO! +"+
      (
        cleared*40*combo
      )+
      " POINTS";
  }

  else{

    messageEl.textContent =
      "🔥🔥 "+
      combo+
      "x COMBO!";
  }

  /*
     Immediately remove the tapped group.
  */

  render();

  await wait(120);

  /*
     Gravity.
  */

  collapseColumns();

  render();

  await wait(120);

  /*
     Now check whether the falling blocks
     created new matching groups.
  */

  chain=0;

  await resolveChains();

  /*
     If no chain happened, the combo remains
     alive for the next successful move.
  */

  if(chain===0){

    if(combo>=3){

      messageEl.textContent =
        "🔥 "+combo+"x COMBO!";
    }

  }

  /*
     Gradually reset combo after inactivity.
  */

  clearTimeout(window.comboTimeout);

  window.comboTimeout =
    setTimeout(()=>{

      if(!paused && !gameOver){

        combo=0;

        updateStats();

      }

    },2300);

  updateStats();

}


/* =========================================================
   RISING ROW SYSTEM
   ========================================================= */

function addRisingRow(){

  if(paused || gameOver) return;

  /*
     If the top row is occupied,
     adding another row means danger.
  */

  for(let c=0;c<COLS;c++){

    if(grid[0][c]){

      triggerDanger();

      return;
    }
  }

  /*
     Shift everything upward.
  */

  for(let r=0;r<ROWS-1;r++){

    for(let c=0;c<COLS;c++){

      grid[r][c]=
        grid[r+1][c];
    }
  }

  /*
     New row enters from bottom.
  */

  const newRow=[];

  for(let c=0;c<COLS;c++){

    newRow.push(
      randomBlock()
    );
  }

  grid[ROWS-1]=newRow;

  /*
     Rising row feedback.
  */

  messageEl.className="message";

  messageEl.textContent =
    "⬆️ NEW ROW!";

  vibrate(
    [12,25,12]
  );

  beep(
    280,
    .1,
    "square",
    .03
  );

  render();

  checkDanger();
}


/* =========================================================
   DANGER SYSTEM
   ========================================================= */

function checkDanger(){

  let occupiedTop=0;

  for(let c=0;c<COLS;c++){

    if(grid[0][c]){

      occupiedTop++;
    }
  }

  if(occupiedTop>=5){

    triggerDanger();
  }

  else{

    boardWrap.classList.remove(
      "danger"
    );

    clearInterval(
      dangerTimer
    );
  }
}

function triggerDanger(){

  if(gameOver) return;

  boardWrap.classList.add(
    "danger"
  );

  messageEl.className=
    "message danger";

  messageEl.textContent =
    "🚨 CRITICAL! CLEAR THE TOP!";

  playDangerSound();

  vibrate(
    [35,45,35]
  );

  clearInterval(
    dangerTimer
  );

  dangerTimer =
    setInterval(()=>{

      if(
        !paused &&
        !gameOver
      ){

        boardWrap.classList.toggle(
          "danger"
        );

        beep(
          160,
          .07,
          "square",
          .02
        );
      }

    },650);

  /*
     Give the player a little room,
     but don't let the warning run forever.
  */

  clearTimeout(
    window.dangerEnd
  );

  window.dangerEnd =
    setTimeout(()=>{

      clearInterval(
        dangerTimer
      );

      boardWrap.classList.remove(
        "danger"
      );

      if(!gameOver){

        messageEl.className=
          "message";

        messageEl.textContent =
          "Keep collapsing!";
      }

    },2600);
}


/* =========================================================
   GAME OVER
   ========================================================= */

function endGame(){

  gameOver=true;

  clearInterval(
    riseTimer
  );

  clearInterval(
    dangerTimer
  );

  boardWrap.classList.add(
    "danger"
  );

  messageEl.className=
    "message danger";

  messageEl.textContent =
    "💀 GAME OVER!";

  vibrate(
    [90,60,130,70,180]
  );

  playDangerSound();

  setTimeout(()=>{

    showOverlay(
      "GAME OVER",
      "Final Score: "+
      score.toLocaleString()+
      "<br><br>"+
      "Best Score: "+
      best.toLocaleString(),
      "PLAY AGAIN"
    );

  },450);
}


/* =========================================================
   PAUSE
   ========================================================= */

function togglePause(){

  if(gameOver) return;

  paused=!paused;

  if(paused){

    pauseBtn.textContent =
      "▶ RESUME";

    pauseBtn.classList.add(
      "paused"
    );

    showOverlay(
      "PAUSED",
      "The board is frozen.",
      "RESUME"
    );

  }

  else{

    pauseBtn.textContent =
      "II PAUSE";

    pauseBtn.classList.remove(
      "paused"
    );

    overlay.classList.remove(
      "show"
    );

    messageEl.className=
      "message";

    messageEl.textContent =
      "Keep going! 🔥";
  }
}


/* =========================================================
   OVERLAY
   ========================================================= */

function showOverlay(
  title,
  text,
  buttonText
){

  overlayTitle.textContent=
    title;

  overlayText.innerHTML=
    text;

  overlayButton.textContent=
    buttonText;

  overlay.classList.add(
    "show"
  );
}

overlayButton.addEventListener(
  "click",
  ()=>{

    if(gameOver){

      restartGame();

    }

    else{

      paused=false;

      pauseBtn.textContent=
        "II PAUSE";

      pauseBtn.classList.remove(
        "paused"
      );

      overlay.classList.remove(
        "show"
      );
    }
  }
);


/* =========================================================
   RESTART
   ========================================================= */

function restartGame(){

  clearInterval(
    riseTimer
  );

  clearInterval(
    dangerTimer
  );

  score=0;
  combo=0;
  chain=0;

  paused=false;
  gameOver=false;

  boardWrap.classList.remove(
    "danger"
  );

  pauseBtn.textContent=
    "II PAUSE";

  pauseBtn.classList.remove(
    "paused"
  );

  overlay.classList.remove(
    "show"
  );

  messageEl.className=
    "message";

  messageEl.textContent =
    "Tap groups of 2 or more matching blocks!";

  createBoard();

  render();

  updateStats();

  startRiseTimer();

  vibrate(20);

  initAudio();

  beep(
    420,
    .08,
    "triangle",
    .03
  );
}


/* =========================================================
   RISE TIMER
   ========================================================= */

function startRiseTimer(){

  clearInterval(
    riseTimer
  );

  /*
     Starts slow and gets faster
     as the score increases.
  */

  const scheduleRise=()=>{

    if(gameOver) return;

    const delay =
      Math.max(
        2300,
        5200 -
        Math.min(
          score*0.08,
          2800
        )
      );

    riseTimer =
      setTimeout(()=>{

        addRisingRow();

        scheduleRise();

      },delay);
  };

  scheduleRise();
}


/* =========================================================
   SOUND TOGGLE
   ========================================================= */

soundBtn.addEventListener(
  "click",
  ()=>{

    soundOn=!soundOn;

    soundBtn.textContent =
      soundOn
        ? "🔊 SOUND ON"
        : "🔇 SOUND OFF";

    if(soundOn){

      initAudio();

      beep(
        600,
        .08,
        "triangle",
        .03
      );
    }
  }
);


/* =========================================================
   BUTTONS
   ========================================================= */

restartBtn.addEventListener(
  "click",
  restartGame
);

pauseBtn.addEventListener(
  "click",
  togglePause
);


/* =========================================================
   STATS
   ========================================================= */

function updateStats(){

  scoreEl.textContent =
    score.toLocaleString();

  comboEl.textContent =
    combo;

  bestEl.textContent =
    best.toLocaleString();
}


/* =========================================================
   UTILITY
   ========================================================= */

function wait(ms){

  return new Promise(
    resolve=>
      setTimeout(
        resolve,
        ms
      )
  );
}


/* =========================================================
   START
   ========================================================= */

createBoard();

render();

updateStats();

startRiseTimer();


/* =========================================================
   PREVENT DOUBLE-TAP ZOOM
   ========================================================= */

let lastTap=0;

document.addEventListener(
  "touchend",
  e=>{

    const now=Date.now();

    if(now-lastTap<300){

      e.preventDefault();
    }

    lastTap=now;

  },
  {passive:false}
);


/* =========================================================
   KEYBOARD SUPPORT
   ========================================================= */

document.addEventListener(
  "keydown",
  e=>{

    if(e.key===" "){

      e.preventDefault();

      togglePause();
    }

    if(
      e.key.toLowerCase()==="r"
    ){

      restartGame();
    }
  }
);

</script>

</body>
</html>
