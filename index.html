<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>COLLAPSE: RELOADED</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;

    background: #080a10;

    color: white;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    overflow: hidden;
}

body {
    display: flex;
    justify-content: center;
}

.game {

    width: 100%;
    max-width: 500px;

    min-height: 100vh;

    padding:
        18px 14px;

    display: flex;
    flex-direction: column;
}


/* ================================
   HEADER
================================ */

.header {
    text-align: center;
    margin-bottom: 12px;
}

.title {

    font-size: 27px;

    font-weight: 900;

    letter-spacing: 3px;

    margin: 0;
}

.subtitle {

    margin-top: 3px;

    color: #777f91;

    font-size: 11px;

    letter-spacing: 4px;
}


/* ================================
   STATS
================================ */

.stats {

    display: flex;

    gap: 10px;

    margin-bottom: 12px;
}

.stat {

    flex: 1;

    background: #131722;

    border:
        1px solid #252b38;

    border-radius: 14px;

    padding: 9px;

    text-align: center;
}

.stat-label {

    color: #7f8798;

    font-size: 10px;

    letter-spacing: 1px;

    text-transform: uppercase;
}

.stat-value {

    margin-top: 2px;

    font-size: 21px;

    font-weight: 900;
}


/* ================================
   BOARD
================================ */

#board {

    width: 100%;

    aspect-ratio: 8 / 12;

    background: #0d1018;

    border:
        2px solid #272d3b;

    border-radius: 18px;

    padding: 5px;

    display: grid;

    grid-template-columns:
        repeat(8, 1fr);

    grid-template-rows:
        repeat(12, 1fr);

    gap: 3px;

    overflow: hidden;

    box-shadow:
        0 0 35px rgba(0,0,0,.5),
        inset 0 0 25px rgba(0,0,0,.45);

    touch-action: manipulation;

    transition:
        border-color .25s ease,
        box-shadow .25s ease;
}


/* ================================
   RISING ANIMATION
================================ */

#board.rising .cell {

    animation:
        riseIntoPlace .38s
        cubic-bezier(.22,.8,.25,1);

}

@keyframes riseIntoPlace {

    0% {

        transform:
            translateY(100%);

        opacity: .35;
    }

    100% {

        transform:
            translateY(0);

        opacity: 1;
    }
}


/* ================================
   DANGER MODE
================================ */

#board.danger {

    border-color:
        #ff3155;

    box-shadow:
        0 0 22px
        rgba(255,49,85,.35),

        inset 0 0 25px
        rgba(255,49,85,.08);

    animation:
        dangerPulse .8s
        infinite alternate;
}

@keyframes dangerPulse {

    from {

        box-shadow:
            0 0 12px
            rgba(255,49,85,.20),

            inset 0 0 15px
            rgba(255,49,85,.05);
    }

    to {

        box-shadow:
            0 0 30px
            rgba(255,49,85,.55),

            inset 0 0 30px
            rgba(255,49,85,.12);
    }
}


/* ================================
   CELLS
================================ */

.cell {

    position: relative;

    border-radius: 7px;

    transition:
        transform .12s ease,
        opacity .12s ease;
}

.cell:active {

    transform:
        scale(.82);
}


/* Empty */

.empty {

    background:
        transparent;
}


/* Red */

.red {

    background:
        linear-gradient(
            145deg,
            #ff4d67,
            #c91f40
        );

    box-shadow:
        0 0 10px
        rgba(255,55,85,.28);
}


/* Blue */

.blue {

    background:
        linear-gradient(
            145deg,
            #4d9dff,
            #2461d8
        );

    box-shadow:
        0 0 10px
        rgba(60,130,255,.28);
}


/* Green */

.green {

    background:
        linear-gradient(
            145deg,
            #4ee38a,
            #18a85b
        );

    box-shadow:
        0 0 10px
        rgba(40,220,120,.28);
}


/* Yellow */

.yellow {

    background:
        linear-gradient(
            145deg,
            #ffe96a,
            #e4a91f
        );

    box-shadow:
        0 0 10px
        rgba(255,215,55,.28);
}


/* Purple */

.purple {

    background:
        linear-gradient(
            145deg,
            #c277ff,
            #7436ce
        );

    box-shadow:
        0 0 10px
        rgba(170,80,255,.28);
}


/* ================================
   MESSAGE
================================ */

.message {

    min-height: 25px;

    margin-top: 9px;

    text-align: center;

    font-size: 14px;

    font-weight: 900;

    color: #9da6b8;
}

.message.danger-message {

    color:
        #ff4968;

    animation:
        warningFlash .55s
        infinite alternate;
}

@keyframes warningFlash {

    from {
        opacity: .55;
    }

    to {
        opacity: 1;
    }
}

.combo {

    color: white;

    animation:
        messagePop .25s ease;
}

@keyframes messagePop {

    0% {

        transform:
            scale(.7);

        opacity: 0;
    }

    100% {

        transform:
            scale(1);

        opacity: 1;
    }
}


/* ================================
   CONTROLS
================================ */

.controls {

    display: flex;

    gap: 10px;

    margin-top: 10px;
}

button {

    border: 0;

    border-radius: 15px;

    padding: 14px;

    font-size: 14px;

    font-weight: 900;

    letter-spacing: 1px;

    cursor: pointer;

    touch-action: manipulation;
}

#restart {

    flex: 1;

    background: #202634;

    color: white;
}

#pause {

    flex: 1;

    background: white;

    color: #080a10;
}

button:active {

    transform:
        scale(.97);
}


/* ================================
   GAME OVER
================================ */

.game-over {

    position: fixed;

    inset: 0;

    z-index: 20;

    display: none;

    align-items: center;

    justify-content: center;

    padding: 25px;

    background:
        rgba(5,7,12,.90);

    backdrop-filter:
        blur(9px);
}

.game-over-card {

    width: 100%;

    max-width: 360px;

    padding: 30px 22px;

    text-align: center;

    background: #141822;

    border:
        1px solid #303747;

    border-radius: 24px;

    box-shadow:
        0 20px 60px
        rgba(0,0,0,.5);

    animation:
        gameOverIn .35s ease;
}

@keyframes gameOverIn {

    0% {

        transform:
            scale(.8);

        opacity: 0;
    }

    100% {

        transform:
            scale(1);

        opacity: 1;
    }
}

.game-over-card h2 {

    margin:
        0 0 8px;

    font-size: 32px;

    letter-spacing: 2px;
}

.final-label {

    color: #8c94a5;

    font-size: 12px;

    letter-spacing: 2px;
}

.final-score {

    margin:
        8px 0 22px;

    font-size: 48px;

    font-weight: 900;
}

#playAgain {

    width: 100%;

    background: white;

    color: black;
}


/* ================================
   SMALL SCREENS
================================ */

@media (max-height: 700px) {

    .game {

        padding-top: 9px;
    }

    .title {

        font-size: 23px;
    }

    .stats {

        margin-bottom: 8px;
    }

    .message {

        margin-top: 5px;
    }

    .controls {

        margin-top: 5px;
    }
}

</style>

</head>


<body>


<div class="game">


    <div class="header">

        <div class="title">
            COLLAPSE: RELOADED
        </div>

        <div class="subtitle">
            TAP • COLLAPSE • DOMINATE
        </div>

    </div>


    <div class="stats">


        <div class="stat">

            <div class="stat-label">
                Score
            </div>

            <div
                class="stat-value"
                id="score"
            >
                0
            </div>

        </div>


        <div class="stat">

            <div class="stat-label">
                Combo
            </div>

            <div
                class="stat-value"
                id="combo"
            >
                0
            </div>

        </div>


        <div class="stat">

            <div class="stat-label">
                Best
            </div>

            <div
                class="stat-value"
                id="best"
            >
                0
            </div>

        </div>


    </div>


    <div id="board"></div>


    <div
        class="message"
        id="message"
    >
        ⬆️ THE BOARD IS RISING...
    </div>


    <div class="controls">

        <button id="restart">
            ↻ RESTART
        </button>

        <button id="pause">
            Ⅱ PAUSE
        </button>

    </div>


</div>


<div
    class="game-over"
    id="gameOver"
>

    <div class="game-over-card">

        <h2>
            GAME OVER
        </h2>

        <div class="final-label">
            FINAL SCORE
        </div>

        <div
            class="final-score"
            id="finalScore"
        >
            0
        </div>

        <button id="playAgain">
            PLAY AGAIN
        </button>

    </div>

</div>


<script>


/* =========================================
   GAME SETTINGS
========================================= */

const COLS = 8;

const ROWS = 12;

const COLORS = [
    "red",
    "blue",
    "green",
    "yellow",
    "purple"
];


/* =========================================
   GAME VARIABLES
========================================= */

let board = [];

let score = 0;

let combo = 0;

let best =
    Number(
        localStorage.getItem(
            "collapseBest"
        ) || 0
    );

let paused = false;

let gameEnded = false;

let riseInterval = null;


/* =========================================
   ELEMENTS
========================================= */

const boardElement =
    document.getElementById(
        "board"
    );

const scoreElement =
    document.getElementById(
        "score"
    );

const comboElement =
    document.getElementById(
        "combo"
    );

const bestElement =
    document.getElementById(
        "best"
    );

const messageElement =
    document.getElementById(
        "message"
    );

const gameOverElement =
    document.getElementById(
        "gameOver"
    );

const finalScoreElement =
    document.getElementById(
        "finalScore"
    );

const pauseButton =
    document.getElementById(
        "pause"
    );


bestElement.textContent =
    best;


/* =========================================
   RANDOM COLOR
========================================= */

function randomColor() {

    return COLORS[
        Math.floor(
            Math.random() *
            COLORS.length
        )
    ];
}


/* =========================================
   VIBRATION
========================================= */

function vibrate(pattern) {

    if (
        "vibrate" in navigator
    ) {

        navigator.vibrate(
            pattern
        );
    }
}


/* =========================================
   CREATE BOARD
========================================= */

function createBoard() {

    clearInterval(
        riseInterval
    );


    board = [];


    for (
        let row = 0;
        row < ROWS;
        row++
    ) {

        board[row] = [];


        for (
            let col = 0;
            col < COLS;
            col++
        ) {

            /*
               Empty space at the top
               gives the player time
               to start.
            */

            if (
                row < 5
            ) {

                board[row][col] =
                    null;

            } else {

                board[row][col] =
                    randomColor();
            }
        }
    }


    score = 0;

    combo = 0;

    paused = false;

    gameEnded = false;


    pauseButton.textContent =
        "Ⅱ PAUSE";


    gameOverElement.style.display =
        "none";


    boardElement.classList.remove(
        "danger"
    );


    messageElement.classList.remove(
        "danger-message"
    );


    updateStats();

    render();


    messageElement.textContent =
        "⬆️ THE BOARD IS RISING...";


    startRiseTimer();
}


/* =========================================
   RENDER
========================================= */

function render() {

    boardElement.innerHTML = "";


    for (
        let row = 0;
        row < ROWS;
        row++
    ) {

        for (
            let col = 0;
            col < COLS;
            col++
        ) {

            const cell =
                document.createElement(
                    "div"
                );


            cell.className =
                "cell";


            const color =
                board[row][col];


            if (color) {

                cell.classList.add(
                    color
                );

            } else {

                cell.classList.add(
                    "empty"
                );
            }


            cell.addEventListener(
                "click",
                () => {

                    if (
                        !paused &&
                        !gameEnded
                    ) {

                        collapse(
                            row,
                            col
                        );
                    }
                }
            );


            boardElement.appendChild(
                cell
            );
        }
    }


    updateDanger();
}


/* =========================================
   DANGER CHECK
========================================= */

function updateDanger() {

    let danger = false;

    let critical = false;


    /*
       Top three rows =
       danger.

       Top row =
       critical.
    */

    for (
        let row = 0;
        row < 3;
        row++
    ) {

        for (
            let col = 0;
            col < COLS;
            col++
        ) {

            if (
                board[row][col]
            ) {

                danger = true;

                if (
                    row === 0
                ) {

                    critical = true;
                }
            }
        }
    }


    if (danger) {

        boardElement.classList.add(
            "danger"
        );

        messageElement.classList.add(
            "danger-message"
        );


        if (critical) {

            messageElement.innerHTML =
                "🚨 <strong>CRITICAL!</strong> CLEAR THE TOP!";

        } else {

            messageElement.innerHTML =
                "⚠️ <strong>DANGER!</strong> BLOCKS ARE GETTING HIGH!";
        }

    } else {

        boardElement.classList.remove(
            "danger"
        );

        messageElement.classList.remove(
            "danger-message"
        );
    }
}


/* =========================================
   FIND MATCHING GROUP
========================================= */

function getGroup(
    startRow,
    startCol
) {

    const color =
        board[startRow][startCol];


    if (!color) {

        return [];
    }


    const group = [];

    const visited =
        new Set();


    const queue = [
        [
            startRow,
            startCol
        ]
    ];


    while (
        queue.length
    ) {

        const [
            row,
            col
        ] =
            queue.shift();


        const key =
            `${row},${col}`;


        if (
            visited.has(key)
        ) {

            continue;
        }


        visited.add(key);


        if (
            row < 0 ||
            row >= ROWS ||
            col < 0 ||
            col >= COLS
        ) {

            continue;
        }


        if (
            board[row][col] !==
            color
        ) {

            continue;
        }


        group.push([
            row,
            col
        ]);


        queue.push([
            row - 1,
            col
        ]);

        queue.push([
            row + 1,
            col
        ]);

        queue.push([
            row,
            col - 1
        ]);

        queue.push([
            row,
            col + 1
        ]);
    }


    return group;
}


/* =========================================
   COLLAPSE
========================================= */

function collapse(
    row,
    col
) {

    if (
        paused ||
        gameEnded
    ) {

        return;
    }


    const group =
        getGroup(
            row,
            col
        );


    if (
        group.length < 2
    ) {

        combo = 0;

        updateStats();

        messageElement.textContent =
            "NEED 2+ MATCHING BLOCKS!";

        return;
    }


    combo++;


    const size =
        group.length;


    const points =
        size *
        size *
        10 *
        combo;


    score += points;


    for (
        const [r, c]
        of group
    ) {

        board[r][c] =
            null;
    }


    applyGravity();


    updateBest();


    render();


    vibrate(
        size >= 5
            ? [20, 30, 20]
            : 15
    );


    messageElement.innerHTML =
        `<span class="combo">
            💥 ${size} BLOCKS!
            +${points} POINTS
        </span>`;


    updateStats();


    setTimeout(
        checkChainReaction,
        150
    );


    setTimeout(
        () => {

            if (
                !gameEnded
            ) {

                combo = 0;

                updateStats();
            }

        },
        1200
    );
}


/* =========================================
   CHAIN REACTION
========================================= */

function checkChainReaction() {

    if (
        paused ||
        gameEnded
    ) {

        return;
    }


    for (
        let row = 0;
        row < ROWS;
        row++
    ) {

        for (
            let col = 0;
            col < COLS;
            col++
        ) {

            if (
                !board[row][col]
            ) {

                continue;
            }


            const group =
                getGroup(
                    row,
                    col
                );


            if (
                group.length >= 2
            ) {

                combo++;


                const size =
                    group.length;


                const points =
                    size *
                    size *
                    15 *
                    combo;


                score += points;


                for (
                    const [r, c]
                    of group
                ) {

                    board[r][c] =
                        null;
                }


                applyGravity();


                updateBest();

                updateStats();

                render();


                vibrate(
                    [15, 25, 15]
                );


                messageElement.innerHTML =
                    `<span class="combo">
                        🔥 CHAIN ×${combo}!
                        +${points}
                    </span>`;


                setTimeout(
                    checkChainReaction,
                    200
                );


                return;
            }
        }
    }
}


/* =========================================
   GRAVITY
========================================= */

function applyGravity() {

    for (
        let col = 0;
        col < COLS;
        col++
    ) {

        const remaining = [];


        for (
            let row = ROWS - 1;
            row >= 0;
            row--
        ) {

            if (
                board[row][col]
            ) {

                remaining.push(
                    board[row][col]
                );
            }
        }


        for (
            let row = ROWS - 1;
            row >= 0;
            row--
        ) {

            const index =
                ROWS - 1 - row;


            board[row][col] =
                remaining[index] ||
                null;
        }
    }
}


/* =========================================
   ADD RISING ROW
========================================= */

function addNewRow() {

    if (
        paused ||
        gameEnded
    ) {

        return;
    }


    /*
       If blocks are already touching
       the top, game over.
    */

    for (
        let col = 0;
        col < COLS;
        col++
    ) {

        if (
            board[0][col]
        ) {

            endGame();

            return;
        }
    }


    /*
       Move the entire board upward.
    */

    for (
        let row = 0;
        row < ROWS - 1;
        row++
    ) {

        for (
            let col = 0;
            col < COLS;
            col++
        ) {

            board[row][col] =
                board[row + 1][col];
        }
    }


    /*
       Add new blocks at bottom.
    */

    for (
        let col = 0;
        col < COLS;
        col++
    ) {

        board[ROWS - 1][col] =
            randomColor();
    }


    combo = 0;


    /*
       Render the new board,
       then trigger the visual
       rising animation.
    */

    render();


    boardElement.classList.remove(
        "rising"
    );


    /*
       Force browser to recognize
       the animation restarting.
    */

    void boardElement.offsetWidth;


    boardElement.classList.add(
        "rising"
    );


    setTimeout(
        () => {

            boardElement.classList.remove(
                "rising"
            );

        },
        450
    );


    updateStats();


    vibrate(
        10
    );


    updateDanger();


    if (
        !boardElement.classList.contains(
            "danger"
        )
    ) {

        messageElement.innerHTML =
            `<span class="combo">
                ⬆️ NEW ROW!
            </span>`;
    }
}


/* =========================================
   RISE SPEED
========================================= */

function getRiseDelay() {

    /*
       Base speed.

       Score makes the game
       gradually faster.
    */

    const scoreSpeed =
        Math.floor(
            score / 1000
        );


    let delay =
        3000 -
        (
            scoreSpeed *
            200
        );


    /*
       Danger makes it faster.
    */

    if (
        isDanger()
    ) {

        delay -= 400;
    }


    /*
       Critical danger gets
       even faster.
    */

    if (
        isCritical()
    ) {

        delay -= 350;
    }


    return Math.max(
        850,
        delay
    );
}


/* =========================================
   DANGER STATUS
========================================= */

function isDanger() {

    for (
        let row = 0;
        row < 3;
        row++
    ) {

        for (
            let col = 0;
            col < COLS;
            col++
        ) {

            if (
                board[row][col]
            ) {

                return true;
            }
        }
    }


    return false;
}


/* =========================================
   CRITICAL STATUS
========================================= */

function isCritical() {

    for (
        let col = 0;
        col < COLS;
        col++
    ) {

        if (
            board[0][col]
        ) {

            return true;
        }
    }


    return false;
}


/* =========================================
   RISING TIMER
========================================= */

function startRiseTimer() {

    clearInterval(
        riseInterval
    );


    if (
        gameEnded
    ) {

        return;
    }


    const delay =
        getRiseDelay();


    riseInterval =
        setInterval(
            () => {

                if (
                    paused ||
                    gameEnded
                ) {

                    return;
                }


                addNewRow();


                clearInterval(
                    riseInterval
                );


                if (
                    !gameEnded
                ) {

                    startRiseTimer();
                }

            },
            delay
        );
}


/* =========================================
   PAUSE
========================================= */

function togglePause() {

    if (
        gameEnded
    ) {

        return;
    }


    paused =
        !paused;


    if (paused) {

        pauseButton.textContent =
            "▶ RESUME";


        messageElement.textContent =
            "⏸️ GAME PAUSED";


    } else {

        pauseButton.textContent =
            "Ⅱ PAUSE";


        messageElement.textContent =
            "⬆️ KEEP GOING!";


        startRiseTimer();
    }
}


/* =========================================
   GAME OVER
========================================= */

function endGame() {

    gameEnded = true;


    clearInterval(
        riseInterval
    );


    updateBest();


    finalScoreElement.textContent =
        score;


    gameOverElement.style.display =
        "flex";


    messageElement.textContent =
        "☠️ THE BLOCKS REACHED THE TOP!";


    vibrate(
        [100, 50, 100, 50, 200]
    );
}


/* =========================================
   SCORE DISPLAY
========================================= */

function updateStats() {

    scoreElement.textContent =
        score;


    comboElement.textContent =
        combo;


    bestElement.textContent =
        best;
}


/* =========================================
   BEST SCORE
========================================= */

function updateBest() {

    if (
        score > best
    ) {

        best = score;


        localStorage.setItem(
            "collapseBest",
            best
        );
    }
}


/* =========================================
   RESTART
========================================= */

function restart() {

    clearInterval(
        riseInterval
    );


    createBoard();
}


/* =========================================
   BUTTONS
========================================= */

document
    .getElementById(
        "restart"
    )
    .addEventListener(
        "click",
        restart
    );


pauseButton
    .addEventListener(
        "click",
        togglePause
    );


document
    .getElementById(
        "playAgain"
    )
    .addEventListener(
        "click",
        restart
    );


/* =========================================
   START
========================================= */

createBoard();

</script>

</body>

</html>
